# Nixpacks build plan for PadelSync.
#
# The repository root has no application code of its own — backend/ and
# frontend/ stay exactly where they are. This file tells Railway explicitly
# how to install and start the app from the repo root so the folder
# structure never has to change.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --prefix backend"]

[phases.build]
cmds = []

[start]
cmd = "node backend/app.js"
