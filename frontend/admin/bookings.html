<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Bookings - PadelSync</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <nav class="navbar" id="navbar"></nav>

    <main class="container">
      <div class="d-flex justify-between align-center mb-2">
        <h2 data-i18n="bookings.scheduleTitle">Schedule & Equipment Orders</h2>
        <div class="d-flex align-center">
          <label
            for="filter-date"
            style="color: #aaaaaa; font-size: 14px; margin-right: 10px"
            data-i18n="bookings.date"
            >Date:</label
          >
          <div class="form-group" style="margin-bottom: 0">
            <input type="date" id="filter-date" />
          </div>
        </div>
      </div>

      <div class="card">
        <div style="overflow-x: auto">
          <table>
            <thead>
              <tr>
                <th data-i18n="bookings.court">Court</th>
                <th data-i18n="bookings.dateHeader">Date</th>
                <th data-i18n="bookings.timeBlock">Time Block</th>
                <th data-i18n="bookings.player">Player</th>
                <th data-i18n="bookings.email">Email</th>
                <th data-i18n="bookings.equipmentOrder">Equipment Order</th>
                <th data-i18n="bookings.actions">Actions</th>
              </tr>
            </thead>
            <tbody id="bookings-table-body">
              <tr>
                <td colspan="7" class="text-center">
                  <div class="spinner" style="margin: 0 auto"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="bookings-pagination" style="margin-top: 20px"></div>

      <section id="cancelled-schedules" class="card cancelled-section">
        <div class="d-flex justify-between align-center mb-1">
          <div>
            <h3>Cancelled Schedules</h3>
            <p class="section-note">
              Cancellation history and the refund amount for each reservation.
            </p>
          </div>
          <span id="cancelled-total" class="badge badge-maintenance"
            >0 cancelled</span
          >
        </div>
        <div style="overflow-x: auto">
          <table>
            <thead>
              <tr>
                <th>Court</th>
                <th>Schedule</th>
                <th>Member</th>
                <th>Deposit</th>
                <th>Refund</th>
                <th>Retained</th>
                <th>Cancelled at</th>
              </tr>
            </thead>
            <tbody id="cancelled-table-body">
              <tr>
                <td colspan="7" class="text-center">
                  No cancelled schedules yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../js/db.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/adminBookings.js"></script>
  </body>
</html>
