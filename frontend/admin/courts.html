<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Courts - PadelSync</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <nav class="navbar" id="navbar"></nav>

    <main class="container">
      <div class="card mb-3">
        <h3 data-i18n="courts.addNew">Add New Court</h3>
        <form
          id="create-court-form"
          novalidate
          class="mt-1"
          style="display: flex; gap: 15px; align-items: flex-end"
        >
          <div class="form-group" style="margin-bottom: 0; flex: 1">
            <label data-i18n="courts.name">Court Name</label>
            <input
              type="text"
              id="court-name"
              required
              placeholder="e.g., Court 5"
            />
          </div>
          <div class="form-group" style="margin-bottom: 0; flex: 2">
            <label data-i18n="courts.description">Description</label>
            <input
              type="text"
              id="court-desc"
              placeholder="Surface / description"
            />
          </div>
          <div class="form-group" style="margin-bottom: 0; flex: 1">
            <label data-i18n="courts.price">Price / 90 min (EGP)</label>
            <input
              type="number"
              id="court-price"
              min="0"
              step="1"
              placeholder="300"
            />
          </div>
          <div class="form-group" style="margin-bottom: 0; flex: 1">
            <label data-i18n="courts.discount">Discount %</label>
            <input
              type="number"
              id="court-discount"
              min="0"
              max="100"
              step="1"
              placeholder="0"
            />
          </div>
          <div class="form-group" style="margin-bottom: 0; flex: 1">
            <label data-i18n="courts.photo">Court Photo</label>
            <input type="file" id="court-image" accept="image/*" />
          </div>
          <button
            type="submit"
            class="btn btn-blue"
            id="createBtn"
            data-i18n="courts.addCourt"
          >
            Add Court
          </button>
        </form>
      </div>

      <div class="card mb-3">
        <h3 data-i18n="courts.bulkPricing">Bulk Pricing</h3>
        <p
          class="mt-1"
          style="color: var(--text-muted); font-size: 0.9rem"
          data-i18n="courts.bulkPricingDesc"
        >
          Apply a new price and/or a discount to every court at once. Leave a
          field blank to leave that setting unchanged.
        </p>
        <form
          id="bulk-pricing-form"
          novalidate
          class="mt-2"
          style="display: flex; gap: 15px; align-items: flex-end"
        >
          <div class="form-group" style="margin-bottom: 0; flex: 1">
            <label data-i18n="courts.newPriceAll"
              >New price for all courts (EGP)</label
            >
            <input
              type="number"
              id="bulk-price"
              min="0"
              step="1"
              placeholder="e.g., 350"
            />
          </div>
          <div class="form-group" style="margin-bottom: 0; flex: 1">
            <label data-i18n="courts.discountAll"
              >Discount % for all courts</label
            >
            <input
              type="number"
              id="bulk-discount"
              min="0"
              max="100"
              step="1"
              placeholder="e.g., 15"
            />
          </div>
          <button
            type="submit"
            class="btn btn-blue"
            id="applyBulkPricingBtn"
            data-i18n="courts.applyToAll"
          >
            Apply to All Courts
          </button>
        </form>
      </div>

      <h2 class="mb-2" data-i18n="courts.title">Courts</h2>
      <div id="courts-list" class="grid grid-3">
        <div class="spinner"></div>
      </div>
      <div id="courts-pagination"></div>
    </main>

    <script src="../js/db.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/pagination.js"></script>
    <script src="../js/manageCourts.js"></script>
  </body>
</html>
